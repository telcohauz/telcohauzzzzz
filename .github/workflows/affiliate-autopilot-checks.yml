name: Affiliate Autopilot checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: affiliate-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: affiliate-autopilot
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q autopilot
      - run: python3 tools/security_check.py
